# Local development database only. Do not use these credentials anywhere else.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cornerops
      POSTGRES_PASSWORD: cornerops
      POSTGRES_DB: cornerops
    ports:
      - '5432:5432'
    volumes:
      - cornerops-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cornerops']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cornerops-db:
